name: ci

# Pull requests receive only the mandatory history-wide secret scan. Release
# validation and packaging are owned by release.yml and never run for a PR.
on:
  pull_request:

jobs:
  secret-scan:
    name: Scan history for secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # `--log-opts=--all` scans every reachable commit, not merely HEAD.
          fetch-depth: 0
      - name: Install Gitleaks from its official release
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Fail closed if the published digest does not match the download.
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" checksums.txt gitleaks
      - name: Scan every reachable commit
        run: gitleaks git --redact --log-opts='--all' .
