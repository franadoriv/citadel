name: ci

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - master

jobs:
  rust:
    # macOS validation is intentionally deferred until the Apple release
    # credentials are available. Keep the native packaging targets local-only
    # for now so ordinary develop CI remains the established Linux gate.
    runs-on: ubuntu-latest
    env:
      # CI validates behavior, not debug-symbol quality. Keeping symbols out of
      # test artifacts prevents the full feature matrix from exhausting the
      # finite disk on GitHub-hosted runners.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Registry downloads are reusable; target/ artifacts compete with
          # the all-target, all-feature test build for runner disk space.
          cache-targets: false
      - name: Report disk space before Rust compilation
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Report disk space before Rust tests
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - run: cargo test --all-targets --all-features
      - run: bash scripts/check-docs.sh
      - run: bash scripts/check-sdk-parity.sh
      - run: python3 scripts/check-godot-web-sdk.py

  godot-web-sdk:
    # A browser export cannot be built on a developer workstation. Validate the
    # pure-GDScript transport and compile a real Web artifact on a Linux CI
    # runner instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Godot 4.3 and Web export templates
        run: |
          curl -fsSL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          curl -fsSL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d "$RUNNER_TEMP/godot-templates"
          mv "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Run Godot Web SDK contract test
        run: |
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" make package-client-godot-web
          package="$(find dist -maxdepth 1 -name 'citadel-client-godot-web-v*.zip' -print -quit)"
          test -n "$package"
          python3 scripts/package_godot_web_artifact.py --verify-package "$package"
          package_root="$(unzip -Z1 "$package" | head -1 | cut -d/ -f1)"
          test -n "$package_root"
          unzip -q "$package" -d "$RUNNER_TEMP/godot-web-package"
          cp -R "$RUNNER_TEMP/godot-web-package/$package_root/addons" clients/godot/tests/web/
          "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" --headless --path clients/godot/tests/web --script res://test_web_client.gd
      - name: Run Godot WebSocket transport integration test
        run: |
          mock_log="$RUNNER_TEMP/citadel-godot-web-mock.log"
          python3 clients/godot/tests/web/mock_citadel_websocket.py >"$mock_log" 2>&1 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if grep -q "mock listening" "$mock_log"; then
              break
            fi
            sleep 0.1
          done
          grep -q "mock listening" "$mock_log" || { cat "$mock_log"; exit 1; }
          timeout 15s "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" --headless --path clients/godot/tests/web --script res://test_websocket_integration.gd -- --url=ws://127.0.0.1:7352/
          wait "$mock_pid"
          cat "$mock_log"
      - name: Run exported Godot Web app against real Citadel
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -name 'citadel-client-godot-web-v*.zip' -print -quit)"
          package_root="$(unzip -Z1 "$package" | head -1 | cut -d/ -f1)"
          web_root="$RUNNER_TEMP/godot-web-package/$package_root/web"
          server_log="$RUNNER_TEMP/citadel-godot-web-e2e-server.log"
          web_log="$RUNNER_TEMP/citadel-godot-web-e2e-http.log"
          browser_log="$RUNNER_TEMP/citadel-godot-web-e2e-browser.log"
          cargo build --bin citadel
          target/debug/citadel --yes --config clients/godot/tests/web/citadel-e2e.toml serve >"$server_log" 2>&1 &
          citadel_pid=$!
          (
            cd "$web_root"
            python3 serve_web.py --bind 127.0.0.1 --port 18080
          ) >"$web_log" 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$web_pid" "$citadel_pid" 2>/dev/null || true
            wait "$web_pid" "$citadel_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:17530/health >/dev/null && curl -fsS http://127.0.0.1:18080/index.html >/dev/null; then
              break
            fi
            if ! kill -0 "$citadel_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:17530/health >/dev/null
          curl -fsS http://127.0.0.1:18080/index.html >/dev/null
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome" || { echo "Google Chrome is required for the Godot Web E2E check"; exit 1; }
          if ! python3 scripts/verify_godot_web_e2e.py --browser "$chrome" --url "http://127.0.0.1:18080/index.html?citadel_ws=ws%3A%2F%2F127.0.0.1%3A17532%2F" --browser-log "$browser_log"; then
            cat "$server_log"
            cat "$web_log"
            cat "$browser_log"
            exit 1
          fi
          cat "$server_log"
          cat "$web_log"
          cat "$browser_log"
      - name: Verify the distributable Godot WebAssembly payload
        run: |
          package="$(find dist -maxdepth 1 -name 'citadel-client-godot-web-v*.zip' -print -quit)"
          python3 scripts/package_godot_web_artifact.py --verify-package "$package"

  # Re-enable a native matrix here after Developer ID/notary credentials are
  # configured and the public macOS release path is approved:
  # macos-packages:
  #   matrix: { include: [{ runner: macos-15, target: aarch64 },
  #                       { runner: macos-15-intel, target: x86_64 }] }
  #   runs-on: ${{ matrix.runner }}
  #   steps: [checkout, Rust setup, `make package-macos package-clients-macos`]
