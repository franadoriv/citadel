name: release

# Build the standalone Windows and portable Linux release packages and create a GitHub Release. A
# release is cut by fast-forwarding develop to the long-lived release branch, or
# through workflow_dispatch. Every run first requires a new Cargo version whose
# `v<version>` tag does not already exist; the publish step creates that tag.
# Public ZIP downloads include Windows and statically linked x86_64 and ARM64
# Linux servers plus the portable browser JavaScript SDK. Native macOS package
# targets are deliberately not run in CI until Apple Developer ID and
# notarization credentials are available.

on:
  push:
    branches:
      - release
    # A push whose changes are entirely under website/ (a docs-only fix) skips
    # this whole workflow: no version gate, no binary packaging, no GitHub
    # Release, and the Citadel version stays put. Vercel deploys the docs on its
    # own (its production branch is `release`). Any file outside website/ makes
    # the release run normally. To force a full release regardless of paths, use
    # the manual run (workflow_dispatch) below.
    paths-ignore:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write
jobs:
  validate-release-version:
    name: Require a new release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release validation must see full reachable tag/head history.
          fetch-depth: 0

      - name: Reject tracked or historical runtime ingress media
        run: python3 scripts/check-runtime-ingress-media.py

      - name: Read and validate the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' Cargo.toml | head -1)"
          if [[ -z "$version" ]]; then
            echo "Could not read the Citadel version from Cargo.toml" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Cargo version '$version' is not valid semver" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag '$tag' already exists; bump Cargo.toml before pushing to release." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-checks:
    name: Run release verification
    needs: validate-release-version
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run the canonical verification gate
        run: bash scripts/check.sh
      - name: Run MongoDB replica-set compatibility suite
        run: bash scripts/test-mongodb.sh
      - name: Audit dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  package:
    needs: [validate-release-version, release-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          # RecastNavigation needs MSVC; pin the known-compatible image.
          - runner: windows-2022
            target: windows-x86_64
            platform: windows
          # musl produces a statically linked server that does not depend on a
          # particular distro's glibc. This is the portable Linux download.
          - runner: ubuntu-latest
            target: linux-x86_64-musl
            platform: linux
            rust_target: x86_64-unknown-linux-musl
            package_arch: x86_64-musl
          - runner: ubuntu-latest
            target: linux-aarch64-musl
            platform: linux
            rust_target: aarch64-unknown-linux-musl
            package_arch: aarch64-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || 'x86_64-unknown-linux-musl' }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # macOS signing/notarization steps are intentionally disabled pending the
      # six Apple signing secrets, which are not configured yet. Do not publish
      # unsigned macOS developer archives from this workflow.

      - name: Package server and SDKs (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./make.ps1 package-windows
          ./make.ps1 package-clients-windows

      - name: Install Cross compiler
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Package portable Linux server
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          make package-linux LINUX_CARGO=cross LINUX_TARGET="${{ matrix.rust_target }}" LINUX_PACKAGE_ARCH="${{ matrix.package_arch }}"
          package="$(find dist -maxdepth 1 -name 'citadel-linux-${{ matrix.package_arch }}-v*.zip' -print -quit)"
          test -n "$package"
          unzip -q "$package" -d "$RUNNER_TEMP/citadel-linux-package"
          package_root="$(unzip -Z1 "$package" | head -1 | cut -d/ -f1)"
          test -n "$package_root"
          binary="$RUNNER_TEMP/citadel-linux-package/$package_root/citadel"
          test -x "$binary"
          # Modern musl toolchains emit either "statically linked" or
          # "static-pie linked"; both are self-contained static executables.
          file "$binary" | grep -Eqi 'statically linked|static-pie linked'
          (
            cd "$RUNNER_TEMP/citadel-linux-package/$package_root"
            case "${{ matrix.rust_target }}" in
              x86_64-unknown-linux-musl) ./citadel check ;;
              aarch64-unknown-linux-musl)
                sudo apt-get update
                sudo apt-get install --yes qemu-user-static
                qemu-aarch64-static ./citadel check
                ;;
              *) echo "Unsupported Linux smoke target: ${{ matrix.rust_target }}" >&2; exit 1 ;;
            esac
          )

      # Re-enable native macOS matrix entries, Apple credential import,
      # notarization profile setup, and this package step together once the
      # required secrets are configured. Keeping them all disabled prevents a
      # release from failing or publishing unsigned macOS ZIPs.

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: citadel-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  godot-web:
    needs: [validate-release-version, release-checks]
    name: Package Godot WebAssembly SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Godot 4.3 and Web export templates
        run: |
          curl -fsSL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          curl -fsSL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d "$RUNNER_TEMP/godot-templates"
          mv "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Package and validate Godot WebAssembly SDK
        run: |
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" make package-client-godot-web
          package="$(find dist -maxdepth 1 -name 'citadel-client-godot-web-v*.zip' -print -quit)"
          test -n "$package"
          python3 scripts/package_godot_web_artifact.py --verify-package "$package"

      - name: Run Godot Web SDK contract test
        run: |
          package="$(find dist -maxdepth 1 -name 'citadel-client-godot-web-v*.zip' -print -quit)"
          package_root="$(unzip -Z1 "$package" | head -1 | cut -d/ -f1)"
          test -n "$package_root"
          unzip -q "$package" -d "$RUNNER_TEMP/godot-web-package"
          cp -R "$RUNNER_TEMP/godot-web-package/$package_root/addons" clients/godot/tests/web/
          "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" --headless --path clients/godot/tests/web --script res://test_web_client.gd

      - name: Run Godot WebSocket transport integration test
        run: |
          mock_log="$RUNNER_TEMP/citadel-godot-web-mock.log"
          python3 clients/godot/tests/web/mock_citadel_websocket.py >"$mock_log" 2>&1 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            grep -q "mock listening" "$mock_log" && break
            sleep 0.1
          done
          grep -q "mock listening" "$mock_log"
          timeout 15s "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" --headless --path clients/godot/tests/web --script res://test_websocket_integration.gd -- --url=ws://127.0.0.1:7352/
          wait "$mock_pid"

      - name: Run exported Godot Web app against real Citadel
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -name 'citadel-client-godot-web-v*.zip' -print -quit)"
          package_root="$(unzip -Z1 "$package" | head -1 | cut -d/ -f1)"
          web_root="$RUNNER_TEMP/godot-web-package/$package_root/web"
          server_log="$RUNNER_TEMP/citadel-godot-web-e2e-server.log"
          web_log="$RUNNER_TEMP/citadel-godot-web-e2e-http.log"
          browser_log="$RUNNER_TEMP/citadel-godot-web-e2e-browser.log"
          cargo build --bin citadel
          target/debug/citadel --yes --config clients/godot/tests/web/citadel-e2e.toml serve >"$server_log" 2>&1 &
          citadel_pid=$!
          (cd "$web_root" && python3 serve_web.py --bind 127.0.0.1 --port 18080) >"$web_log" 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$web_pid" "$citadel_pid" 2>/dev/null || true
            wait "$web_pid" "$citadel_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:17530/health >/dev/null && curl -fsS http://127.0.0.1:18080/index.html >/dev/null; then
              break
            fi
            if ! kill -0 "$citadel_pid"; then
              cat "$server_log"
              exit 1
            fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:17530/health >/dev/null
          curl -fsS http://127.0.0.1:18080/index.html >/dev/null
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          # Chromium occasionally exits before creating its DevTools profile on
          # hosted runners. Each invocation uses a fresh profile, so retrying
          # the isolated browser driver is safe and avoids masking a real app
          # failure: the final driver/browser log is printed on failure.
          e2e_status=1
          for attempt in $(seq 1 3); do
            if python3 scripts/verify_godot_web_e2e.py --browser "$chrome" --url "http://127.0.0.1:18080/index.html?citadel_ws=ws%3A%2F%2F127.0.0.1%3A17532%2F" --browser-log "$browser_log"; then
              e2e_status=0
              break
            fi
            echo "Godot Web E2E browser attempt $attempt failed"
            cat "$browser_log" || true
            sleep 2
          done
          test "$e2e_status" -eq 0

      - name: Upload Godot WebAssembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: citadel-godot-web
          path: dist/citadel-client-godot-web-v*.zip
          if-no-files-found: error

  js-sdk:
    needs: [validate-release-version, release-checks]
    name: Package JavaScript browser SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/js/package-lock.json

      - name: Test, package, and validate JavaScript SDK
        shell: bash
        run: |
          set -euo pipefail
          cd clients/js
          npm ci
          npm test
          cd ../..
          make package-client-js
          package="dist/citadel-client-js-v${{ needs.validate-release-version.outputs.version }}.zip"
          test -f "$package"
          unzip -Z1 "$package" | grep -Fx "citadel-client-js-v${{ needs.validate-release-version.outputs.version }}/dist/citadel-client.min.mjs" >/dev/null
          unzip -Z1 "$package" | grep -Fx "citadel-client-js-v${{ needs.validate-release-version.outputs.version }}/SHA256SUMS.txt" >/dev/null

      - name: Upload JavaScript browser SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: citadel-js-sdk
          path: dist/citadel-client-js-v*.zip
          if-no-files-found: error

  publish:
    needs: [validate-release-version, release-checks, package, godot-web, js-sdk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: citadel-*
          path: dist
          merge-multiple: true

      - name: Read version and extract release notes
        id: notes
        shell: bash
        run: |
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' Cargo.toml | head -1)"
          if [[ -z "$version" ]]; then
            echo "Could not read the Citadel version from Cargo.toml" >&2
            exit 1
          fi
          awk -v version="$version" '
            $0 ~ "^##[[:space:]]*\\[?" version "\\]?([[:space:]]|$|\\])" { found=1 }
            found && NR > 1 && $0 ~ "^##[[:space:]]" && $0 !~ "^##[[:space:]]*\\[?" version "\\]?([[:space:]]|$|\\])" { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [[ ! -s RELEASE_NOTES.md ]]; then
            printf 'Citadel v%s\n' "$version" > RELEASE_NOTES.md
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum *.zip > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.notes.outputs.version }}
          name: v${{ steps.notes.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
