language = "C"
header = "/* Citadel client C ABI. Generated by cbindgen; do not edit by hand. */"
include_guard = "CITADEL_CLIENT_H"
autogen_warning = "/* This header is generated from crates/citadel-client-ffi. */"
pragma_once = true
cpp_compat = true
tab_width = 4
style = "type"

[parse]
parse_deps = false

[enum]
# QualifiedScreamingSnakeCase already qualifies variants with the enum name
# (CITADEL_STATUS_OK), so do not also prefix_with_name (would double it).
prefix_with_name = false
rename_variants = "QualifiedScreamingSnakeCase"

# No `export.prefix`: the Rust types already start with `Citadel`, so adding a
# prefix would double it (CitadelCitadelClient).
