<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Citadel returns one shared world</title>
  <desc id="desc">Players send proposed actions to Citadel, which applies rules and returns authoritative shared state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#141126"/><stop offset="1" stop-color="#241744"/></linearGradient>
    <linearGradient id="core" x1="0" x2="1"><stop stop-color="#875dff"/><stop offset="1" stop-color="#e86dce"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f6f1ff}.muted{fill:#c6b8de}.label{font-size:20px;font-weight:600}.small{font-size:16px}.title{font-size:36px;font-weight:750}.card{fill:#211a38;stroke:#8372a8;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="600" cy="335" r="185" fill="#7d55e8" opacity=".14" filter="url(#glow)"/>
  <text x="600" y="76" text-anchor="middle" class="title">One shared world, decided by Citadel</text>
  <text x="600" y="108" text-anchor="middle" class="muted small">Players propose actions; the server applies the rules.</text>
  <g transform="translate(85 220)">
    <rect class="card" width="220" height="104" rx="18"/><circle cx="48" cy="51" r="24" fill="#5ac8fa"/><path d="M39 54c7-18 20-18 26 0M42 40h12" fill="none" stroke="#151126" stroke-width="6" stroke-linecap="round"/>
    <text x="88" y="47" class="label">Players</text><text x="88" y="74" class="muted small">input + intent</text>
  </g>
  <g transform="translate(445 193)"><rect width="310" height="160" rx="24" fill="url(#core)" filter="url(#glow)"/><path d="M95 64l60-35 60 35v68l-60 35-60-35z" fill="#161028" opacity=".9"/><path d="M127 81h56v35h-56z" fill="none" stroke="#f6f1ff" stroke-width="5"/><text x="155" y="146" text-anchor="middle" font-size="28" font-weight="800">CITADEL</text></g>
  <g transform="translate(895 220)">
    <rect class="card" width="220" height="104" rx="18"/><circle cx="47" cy="52" r="24" fill="#68d391"/><path d="M35 53l10 10 18-23" fill="none" stroke="#151126" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="87" y="47" class="label">Shared state</text><text x="87" y="74" class="muted small">same world for all</text>
  </g>
  <path d="M310 272h112" stroke="#5ac8fa" stroke-width="5" stroke-linecap="round"/><path d="M414 263l16 9-16 9" fill="#5ac8fa"/><text x="365" y="252" text-anchor="middle" class="muted small">actions</text>
  <path d="M780 272h112" stroke="#68d391" stroke-width="5" stroke-linecap="round"/><path d="M884 263l16 9-16 9" fill="#68d391"/><text x="835" y="252" text-anchor="middle" class="muted small">authoritative update</text>
  <g transform="translate(286 488)"><rect width="628" height="78" rx="16" fill="#18142a" stroke="#51436e"/><text x="314" y="32" text-anchor="middle" class="label">Validate</text><text x="314" y="59" text-anchor="middle" class="muted small">rules · authority · simulation</text><path d="M205 39h205" stroke="#8e7db8" stroke-width="3"/><path d="M400 30l16 9-16 9" fill="#8e7db8"/><text x="524" y="32" text-anchor="middle" class="label">Broadcast</text><text x="524" y="59" text-anchor="middle" class="muted small">one consistent outcome</text></g>
</svg>
