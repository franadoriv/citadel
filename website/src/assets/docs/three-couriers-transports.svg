<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Three transport paths, one Citadel server</title><desc id="desc">Native QUIC, browser WebTransport and WebSocket all connect to Citadel.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#1d1230"/></linearGradient><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f5f2ff}.title{font-size:36px;font-weight:750}.label{font-size:25px;font-weight:700}.small{font-size:17px;fill:#c6bedb}.card{fill:#1d2038;stroke-width:2}</style></defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="600" y="78" text-anchor="middle" class="title">Three transports. One authoritative server.</text>
  <g transform="translate(70 152)"><rect width="405" height="104" rx="20" class="card" stroke="#57c7ff"/><circle cx="50" cy="52" r="25" fill="#57c7ff"/><text x="95" y="47" class="label">Native QUIC</text><text x="95" y="75" class="small">two reliable lanes · native clients</text></g>
  <g transform="translate(70 286)"><rect width="405" height="104" rx="20" class="card" stroke="#ae87ff"/><circle cx="50" cy="52" r="25" fill="#ae87ff"/><text x="95" y="47" class="label">WebTransport</text><text x="95" y="75" class="small">two reliable lanes · browsers</text></g>
  <g transform="translate(70 420)"><rect width="405" height="104" rx="20" class="card" stroke="#75d69c"/><circle cx="50" cy="52" r="25" fill="#75d69c"/><text x="95" y="47" class="label">WebSocket</text><text x="95" y="75" class="small">dependable bridge · broad compatibility</text></g>
  <g stroke-width="5" fill="none"><path d="M490 204h210" stroke="#57c7ff"/><path d="M490 338h210" stroke="#ae87ff"/><path d="M490 472h210" stroke="#75d69c"/></g>
  <g transform="translate(732 206)"><rect width="380" height="284" rx="28" fill="#30215a" stroke="#d29cff" stroke-width="3"/><path d="M149 75l42-25 42 25v50l-42 25-42-25z" fill="#d29cff"/><text x="190" y="177" text-anchor="middle" class="label">Citadel</text><text x="190" y="208" text-anchor="middle" class="small">same protocol · same sessions</text><text x="190" y="236" text-anchor="middle" class="small">same shared world</text></g>
</svg>
