<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Connection, session and durable identity</title><desc id="desc">A player connection receives a temporary session and then resolves to a durable account identity.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#172238"/><stop offset="1" stop-color="#251432"/></linearGradient><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f7f3ff}.title{font-size:36px;font-weight:750}.label{font-size:25px;font-weight:700}.small{font-size:17px;fill:#c8bfdc}.card{fill:#20223a;stroke:#77708e;stroke-width:2}</style></defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="600" y="78" text-anchor="middle" class="title">Three identities, one player journey</text>
  <g transform="translate(70 225)"><rect width="280" height="170" rx="22" class="card"/><circle cx="66" cy="67" r="32" fill="#5ac8fa"/><path d="M50 74c8-20 24-20 32 0" fill="none" stroke="#182136" stroke-width="7" stroke-linecap="round"/><text x="140" y="63" class="label">Connection</text><text x="140" y="92" class="small">transport socket</text><text x="140" y="120" class="small">short-lived</text></g>
  <g transform="translate(460 225)"><rect width="280" height="170" rx="22" class="card"/><circle cx="66" cy="67" r="32" fill="#c084fc"/><rect x="48" y="47" width="36" height="40" rx="7" fill="#20223a"/><text x="140" y="63" class="label">Session</text><text x="140" y="92" class="small">realtime presence</text><text x="140" y="120" class="small">room + permissions</text></g>
  <g transform="translate(850 225)"><rect width="280" height="170" rx="22" class="card"/><circle cx="66" cy="67" r="32" fill="#72d69f"/><path d="M51 70l12 12 22-28" fill="none" stroke="#182136" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="63" class="label">Account</text><text x="140" y="92" class="small">durable identity</text><text x="140" y="120" class="small">profile + ownership</text></g>
  <g stroke="#e9d8fd" stroke-width="5"><path d="M360 310h80"/><path d="M750 310h80"/></g><path d="M430 301l16 9-16 9M820 301l16 9-16 9" fill="#e9d8fd"/>
  <text x="400" y="285" text-anchor="middle" class="small">authenticate</text><text x="790" y="285" text-anchor="middle" class="small">resolve</text>
</svg>
