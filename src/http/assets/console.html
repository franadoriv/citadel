<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citadel Console</title>
<style>
/*
 * Citadel Console ( shell,  live integration).
 * Nakama-Console-style admin shell (top bar + left sidebar + content),
 * re-themed to a navy-marine ("azul marino") palette. Every color role lives
 * in :root so the whole theme is one place to edit. No build step, no
 * framework, no external fetch — the node serves this file verbatim.
 */
:root {
  /* Navy surfaces: deepest -> lightest panel. */
  --navy-950: #081221;
  --navy-900: #0b1a2d;
  --navy-850: #0f2138;
  --navy-800: #132a45;
  --navy-750: #17324f;
  --navy-700: #1e3c5e;

  /* Accent (brand / interactive) — marine blue. */
  --accent-700: #1b3a6b;
  --accent-600: #23477f;
  --accent-500: #2f5d9e;
  --accent-400: #3f74be;
  --accent-300: #6f9bd8;
  --accent-soft: rgba(47, 93, 158, 0.16);
  --accent-soft-strong: rgba(63, 116, 190, 0.24);

  /* Borders & lines. */
  --border: #1d3350;
  --border-strong: #274468;
  --border-soft: #16283f;

  /* Text. */
  --text: #e9f0f9;
  --text-muted: #9db2cc;
  --text-dim: #6f88a6;
  --text-inverse: #ffffff;

  /* Status semantics. */
  --ok: #35c88f;
  --ok-soft: rgba(53, 200, 143, 0.15);
  --warn: #e0a63a;
  --warn-soft: rgba(224, 166, 58, 0.16);
  --bad: #e5605f;
  --bad-soft: rgba(229, 96, 95, 0.16);
  --info: #3f74be;

  /* Layout metrics (mirrors Nakama's proportions). */
  --sidebar-w: 244px;
  --topbar-h: 56px;
  --radius: 8px;
  --radius-sm: 6px;
  --radius-pill: 999px;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "SFMono-Regular", ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--navy-950);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-300); text-decoration: none; }
a:hover { color: var(--accent-400); }
code, .mono { font-family: var(--mono); font-size: 0.85em; }

/* ---- App shell grid ---- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  grid-template-areas:
    "brand topbar"
    "sidebar content";
  height: 100vh;
}

/* ---- Brand corner ---- */
.brand {
  grid-area: brand;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  background: var(--navy-900);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.brand .mark {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: linear-gradient(150deg, var(--accent-400), var(--accent-700));
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  flex: 0 0 auto;
}
.brand .mark svg { width: 16px; height: 16px; display: block; }
.brand .name { font-weight: 700; letter-spacing: 0.2px; font-size: 15px; }
.brand .name span { color: var(--accent-300); font-weight: 600; }

/* ---- Top bar ---- */
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 20px;
  background: var(--navy-900);
  border-bottom: 1px solid var(--border);
}
.topbar .crumb { color: var(--text-muted); font-weight: 500; }
.topbar .crumb b { color: var(--text); font-weight: 600; }
.topbar .spacer { flex: 1; }
.topbar .meta {
  display: flex; align-items: center; gap: 8px;
  color: var(--text-dim); font-size: 12.5px;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-pill);
  background: var(--navy-850);
  color: var(--text-muted);
  font-size: 12px;
  white-space: nowrap;
}
.chip .k { color: var(--text-dim); }
.chip .v { color: var(--text); font-family: var(--mono); }

/* ---- Status pill ---- */
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 11px;
  border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 600;
  border: 1px solid transparent;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px rgba(255,255,255,0.06); }
.pill.ok { color: var(--ok); background: var(--ok-soft); border-color: rgba(53,200,143,0.35); }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: rgba(224,166,58,0.35); }
.pill.bad { color: var(--bad); background: var(--bad-soft); border-color: rgba(229,96,95,0.35); }
.pill.muted { color: var(--text-dim); background: var(--navy-850); border-color: var(--border); }

/* ---- Sidebar ---- */
.sidebar {
  grid-area: sidebar;
  background: var(--navy-900);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 10px 0 24px;
}
.nav-group { padding: 6px 12px 2px; }
.nav-group .label {
  padding: 8px 12px 4px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.9px;
  text-transform: uppercase; color: var(--text-dim);
}
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 12px; margin: 1px 0;
  border-radius: var(--radius-sm);
  color: var(--text-muted); font-weight: 500;
  cursor: pointer; user-select: none;
  border: 1px solid transparent;
}
.nav-item:hover { background: var(--navy-800); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft); color: var(--text);
  border-color: var(--accent-soft-strong);
}
.nav-item.active .ico { color: var(--accent-300); }
.nav-item .ico { width: 18px; height: 18px; flex: 0 0 auto; color: var(--text-dim); }
.nav-item .ico svg { width: 18px; height: 18px; display: block; stroke: currentColor; fill: none; stroke-width: 1.7; }
.nav-item .txt { flex: 1; }

/* ---- Content ---- */
.content { grid-area: content; overflow-y: auto; padding: 22px 26px 40px; }
.page { max-width: 1180px; margin: 0 auto; }

.page-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
.page-head .titles { flex: 1; }
.page-head h1 { margin: 0 0 3px; font-size: 20px; font-weight: 700; letter-spacing: 0.1px; }
.page-head .sub { margin: 0; color: var(--text-muted); font-size: 13px; }

/* ---- Toolbar ---- */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--navy-850); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 11px; min-width: 260px;
  color: var(--text-dim);
}
.search input {
  background: transparent; border: none; outline: none;
  color: var(--text); font: inherit; width: 100%;
}
.search input::placeholder { color: var(--text-dim); }
.search svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; flex: 0 0 auto; }
.toolbar .grow { flex: 1; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: var(--radius-sm);
  font: inherit; font-weight: 600; font-size: 13px;
  border: 1px solid var(--border-strong); background: var(--navy-800); color: var(--text);
  cursor: pointer;
}
.btn:hover { background: var(--navy-750); }
.btn.primary { background: var(--accent-500); border-color: var(--accent-400); color: var(--text-inverse); }
.btn.primary:hover { background: var(--accent-400); }
.btn.danger { color: var(--bad); border-color: rgba(229,96,95,0.4); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn:disabled, .btn.disabled { opacity: 0.55; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; }

/* ---- Panels & cards ---- */
.panel {
  background: var(--navy-850); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden;
}
.panel + .panel { margin-top: 18px; }
.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  background: var(--navy-800);
}
.panel-head h2 { margin: 0; font-size: 13.5px; font-weight: 700; letter-spacing: 0.2px; }
.panel-head .sub { color: var(--text-dim); font-size: 12px; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 16px; }

/* ---- Stat / gauge cards ---- */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px; margin-bottom: 18px;
}
.stat {
  background: var(--navy-850); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 15px 16px;
  position: relative; overflow: hidden;
}
.stat .k { color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: 0.2px; display: flex; align-items: center; gap: 7px; }
.stat .k .ico { color: var(--accent-300); }
.stat .k .ico svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; display: block; }
.stat .v { font-size: 27px; font-weight: 700; margin: 8px 0 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
.stat .meta { color: var(--text-dim); font-size: 11.5px; }
.gauge { height: 5px; border-radius: 3px; background: var(--navy-750); margin-top: 12px; overflow: hidden; }
.gauge > i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent-500), var(--accent-300)); transition: width 0.6s ease; }

/* ---- Tables ---- */
.table-wrap { width: 100%; overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th {
  text-align: left; font-weight: 600; color: var(--text-muted);
  padding: 10px 16px; background: var(--navy-800);
  border-bottom: 1px solid var(--border); white-space: nowrap;
  font-size: 12px; letter-spacing: 0.2px;
}
table.tbl td { padding: 11px 16px; border-bottom: 1px solid var(--border-soft); color: var(--text); }
table.tbl tr:last-child td { border-bottom: none; }
table.tbl tr:hover td { background: rgba(255,255,255,0.015); }
table.tbl tr.rowlink { cursor: pointer; }
table.tbl tr.deleted td { color: var(--text-dim); font-style: italic; }
.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
.kv td { padding: 9px 4px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
.kv tr:last-child td { border-bottom: none; }
.kv td.k { color: var(--text-muted); width: 190px; font-weight: 500; }
.kv td.v { color: var(--text); font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

.tag-soft {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: var(--radius-pill); font-size: 11px; font-weight: 600;
  background: var(--navy-750); color: var(--text-muted); border: 1px solid var(--border);
}
.tag-soft.on { color: var(--ok); background: var(--ok-soft); border-color: rgba(53,200,143,0.3); }
.tag-soft.warn { color: var(--warn); background: var(--warn-soft); border-color: rgba(224,166,58,0.35); }
.tag-soft.off { color: var(--text-dim); }
.tag-soft.bad { color: var(--bad); background: var(--bad-soft); border-color: rgba(229,96,95,0.3); }

/* ---- Empty state ---- */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 44px 24px; color: var(--text-muted);
}
.empty .glyph {
  width: 52px; height: 52px; border-radius: 14px; margin-bottom: 14px;
  display: grid; place-items: center;
  background: var(--accent-soft); border: 1px solid var(--accent-soft-strong);
  color: var(--accent-300);
}
.empty .glyph svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.empty h3 { margin: 0 0 5px; font-size: 15px; color: var(--text); font-weight: 700; }
.empty p { margin: 0; max-width: 460px; font-size: 13px; line-height: 1.6; }

/* Skeleton shimmer rows for loading tables. */
.skel { height: 10px; border-radius: 4px; background: linear-gradient(90deg, var(--navy-750) 0%, var(--navy-700) 50%, var(--navy-750) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; opacity: 0.5; display: inline-block; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.notice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 14px; border-radius: var(--radius-sm);
  background: var(--warn-soft); border: 1px solid rgba(224,166,58,0.3);
  color: var(--text); font-size: 12.5px; margin-bottom: 16px;
}
.notice svg { width: 16px; height: 16px; stroke: var(--warn); fill: none; stroke-width: 1.9; flex: 0 0 auto; margin-top: 1px; }
.notice b { color: var(--warn); }

textarea.code-in, input.form-in {
  width: 100%; background: var(--navy-900); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-family: var(--mono);
  font-size: 12.5px; padding: 10px 12px; outline: none;
}
textarea.code-in { min-height: 120px; resize: vertical; }
select.form-in {
  width: 100%;
  background: var(--navy-900); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius-sm); padding: 8px 12px; font: inherit; font-size: 13px;
}
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.form-row .field { flex: 1; min-width: 130px; margin-bottom: 0; }
.form-row .field.fixed { flex: 0 0 auto; }
.scope-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.scope-option {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--navy-900);
  color: var(--text-muted); font-family: var(--mono); font-size: 12px;
}
.scope-option input { accent-color: var(--accent-400); }
.inline-error { color: var(--bad); font-size: 12.5px; margin: 0 0 12px; }
.secret-value { user-select: all; overflow-wrap: anywhere; }

pre.code {
  margin: 0; background: var(--navy-900); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 14px; color: var(--text);
  font-family: var(--mono); font-size: 12.5px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
}

.pager {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-top: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
}
.pager .grow { flex: 1; }

/* ---- Lag diagnostics ------------------------------------------------------- */
.lag-note { color: var(--text-dim); font-size: 12px; line-height: 1.55; margin: 0; }
.lag-status { text-transform: none; }
.lag-bars { display: flex; align-items: end; gap: 3px; height: 96px; padding: 8px 0 3px; border-bottom: 1px solid var(--border); }
.lag-bars i { display: block; min-width: 5px; flex: 1 1 8px; max-width: 28px; background: linear-gradient(180deg, var(--accent-300), var(--accent-600)); border-radius: 3px 3px 0 0; }
.lag-axis { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; color: var(--text-dim); font-size: 10.5px; font-family: var(--mono); }
.lag-spark { display: flex; align-items: end; gap: 2px; height: 74px; padding-top: 6px; border-bottom: 1px solid var(--border); }
.lag-spark i { display: block; min-width: 4px; flex: 1 1 5px; max-width: 14px; background: var(--ok); border-radius: 2px 2px 0 0; }
.lag-spark i.warn { background: var(--warn); }
.lag-spark i.bad { background: var(--bad); }
.lag-cohort { display: grid; grid-template-columns: minmax(190px, 1.5fr) repeat(4, minmax(82px, .7fr)); gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 12px; }
.lag-cohort:last-child { border-bottom: 0; }
.lag-cohort .cohort-key { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
.lag-muted { color: var(--text-dim); }
@media (max-width: 720px) { .lag-cohort { grid-template-columns: 1fr 1fr; } }

.updated { color: var(--text-dim); font-size: 12px; }
.updated .dot-live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; animation: pulse 2s infinite; vertical-align: middle; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ---- Inline confirm (native dialogs are never used) ---- */
.confirm-inline { display: inline-flex; align-items: center; gap: 6px; }
.confirm-inline .confirm-q { color: var(--warn); font-size: 12px; font-weight: 700; }

/* ---- Toast (API errors / action feedback, notice-styled) ---- */
.toast {
  position: fixed; top: 14px; right: 16px; z-index: 200;
  max-width: 380px; padding: 11px 14px; border-radius: var(--radius-sm);
  font-size: 12.5px; font-weight: 500; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  border: 1px solid var(--border-strong); background: var(--navy-800); color: var(--text);
}
.toast.show { opacity: 1; }
.toast.bad { background: var(--bad-soft); border-color: rgba(229,96,95,0.45); color: var(--text); }
.toast.ok { background: var(--ok-soft); border-color: rgba(53,200,143,0.45); color: var(--text); }

/* ---- Modal (inline panel dialog) ---- */
.modal-back {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4, 10, 20, 0.65);
  display: grid; place-items: center; padding: 20px;
}
.modal { width: 460px; max-width: 94vw; max-height: 90vh; overflow-y: auto; }

/* ---- Login view ---- */
.login-wrap {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  background: radial-gradient(1200px 600px at 50% -10%, var(--navy-850), var(--navy-950));
}
.login-card { width: 360px; max-width: 92vw; }
.login-brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 18px; }
.login-brand .mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(150deg, var(--accent-400), var(--accent-700));
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}
.login-brand .mark svg { width: 19px; height: 19px; display: block; }
.login-brand .name { font-weight: 700; font-size: 18px; }
.login-brand .name span { color: var(--accent-300); font-weight: 600; }
.login-err { color: var(--bad); font-size: 12.5px; min-height: 18px; margin-bottom: 10px; }
.login-hint { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 14px; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--navy-950); }
::-webkit-scrollbar-thumb { background: var(--navy-700); border-radius: 6px; border: 2px solid var(--navy-950); }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

@media (max-width: 820px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: var(--topbar-h) var(--topbar-h) auto 1fr;
    grid-template-areas: "brand" "topbar" "sidebar" "content";
  }
  .topbar { overflow-x: auto; padding: 0 14px; }
  .topbar .meta { min-width: max-content; }
  .sidebar {
    display: flex; align-items: center; gap: 4px; padding: 6px 8px;
    overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--border);
  }
  .nav-group { display: flex; gap: 4px; padding: 0; flex: 0 0 auto; }
  .nav-group .label { display: none; }
  .nav-item { margin: 0; white-space: nowrap; }
  .content { padding: 18px 14px 32px; }
  .page-head { flex-direction: column; }
  .page-head .btn { width: 100%; justify-content: center; }
  .scope-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="login" class="login-wrap" hidden>
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="name">Citadel <span>Console</span></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Operator sign in</h2></div>
      <div class="panel-body">
        <form id="login-form">
          <div class="field"><label>Username</label><input class="form-in" id="login-user" autocomplete="username" autofocus></div>
          <div class="field"><label>Password</label><input class="form-in" id="login-pass" type="password" autocomplete="current-password"></div>
          <div id="login-err" class="login-err"></div>
          <button class="btn primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
        </form>
      </div>

  function svg(name) { return '<svg viewBox="0 0 24 24">' + (I[name] || '') + '</svg>'; }

  // ---- HTML escaping ------------------------------------------------------
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ---- Small DOM / formatting helpers -------------------------------------
  function qs(id) { return document.getElementById(id); }
  function setText(id, v) { var el = qs(id); if (el) el.textContent = v == null ? '-' : v; }
  function setHtml(id, html) { var el = qs(id); if (el) el.innerHTML = html; }
  function debounce(fn, ms) {
    var t;
    return function () {
      var self = this, args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms);
    };
  }
  function fmtNum(n) { return (n == null ? 0 : n).toLocaleString('en-US'); }
  function fmtTime(ms) { return ms ? new Date(ms).toLocaleString() : '—'; }
  function jsonPretty(v) { try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); } }
  function fmtUptime(s) {
    s = Math.max(0, Math.floor(s));
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60); s -= m * 60;
    var out = [];
    if (d) out.push(d + 'd');
    if (h || d) out.push(h + 'h');
    out.push(m + 'm');
    out.push(s + 's');
    return out.join(' ');
  }
  function fmtBytes(n) {
    n = n || 0;
    var u = ['B', 'KB', 'MB', 'GB', 'TB']; var i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
  }
  function fmtUtc(ms) {
    if (!ms || !isFinite(Number(ms))) return '—';
    try { return new Date(Number(ms)).toISOString(); } catch (e) { return '—'; }
  }

  // ---- Auth state + API helper ---------------------------------------------
  var TOKEN_KEY = 'citadel.console.token';
  var ROLE_KEY = 'citadel.console.role';
  var state = { user: null, sessionGeneration: 0, viewGeneration: 0 };
  var ACT = {};   // per-view click actions: data-act -> fn(dataset, el)
  var FORM = {};  // per-view form actions: data-form -> fn(values, formEl)

  function token() { return sessionStorage.getItem(TOKEN_KEY) || ''; }
  function isAdmin() { return !!(state.user && state.user.role === 'admin'); }
  function isViewer() { return !!(state.user && state.user.role === 'viewer'); }
  function adminDis() { return isViewer() ? ' disabled title="admin role required"' : ''; }

  function api(method, path, body) {
    var opts = { method: method, headers: { 'Accept': 'application/json' }, cache: 'no-store' };
    var t = token();
    if (t) opts.headers['Authorization'] = 'Bearer ' + t;
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { logout(true); throw new Error('session expired'); }
      if (r.status === 204) return null;
      return r.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { /* non-JSON body */ }
        if (!r.ok) {
          var err = new Error((data && data.message) ? data.message : ('HTTP ' + r.status));
          err.status = r.status;
          throw err;
        }
        return data;
      });
    });
  }

  function captureApiKeyRequestContext() {
    return {
      route: currentRoute(),
      sessionGeneration: state.sessionGeneration,
      viewGeneration: state.viewGeneration,
      token: token()
    };
  }
  function apiKeyRequestContextIsCurrent(context) {
    return !!state.user
      && context.route === currentRoute()
      && context.sessionGeneration === state.sessionGeneration
      && context.viewGeneration === state.viewGeneration
      && context.token === token();
  }

  // ---- Toast ----------------------------------------------------------------
  var toastTimer = null;
  function toast(msg, kind) {
    var el = qs('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (kind === 'err' ? 'bad' : 'ok');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 4000);
  }
  function fail(e) { if (e && e.message !== 'session expired') toast(e.message || 'request failed', 'err'); }

  // ---- Modal (inline dialog; native dialogs are never used) -----------------
  var modalReturnFocus = null;
  var modalGeneration = 0;
  function openModal(title, bodyHtml) {
    modalGeneration += 1;
    var modalRoot = qs('modal-root');
    if (!modalRoot.firstChild) modalReturnFocus = document.activeElement;
    modalRoot.innerHTML =
      '<div class="modal-back"><div class="panel modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">'
      + '<div class="panel-head"><h2 id="modal-title">' + esc(title) + '</h2><div class="spacer"></div>'
      + '<button class="btn small" data-act="modal-close">Close</button></div>'
      + '<div class="panel-body">' + bodyHtml + '</div></div></div>';
    var dialog = modalRoot.querySelector('[role="dialog"]');
    var focusableSelector = 'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])';
    var modalFocusTarget = dialog.querySelector('.panel-body input:not([disabled]), .panel-body select:not([disabled]), .panel-body textarea:not([disabled]), .panel-body [tabindex]:not([tabindex="-1"]), .panel-body button:not([disabled])')
      || dialog.querySelector(focusableSelector);
    if (modalFocusTarget) modalFocusTarget.focus();
    dialog.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        ev.preventDefault();
        closeModal();
        return;
      }
      if (ev.key !== 'Tab') return;
      var focusable = dialog.querySelectorAll(focusableSelector);
      if (!focusable.length) { ev.preventDefault(); return; }
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (ev.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) {
        ev.preventDefault();
        last.focus();
      } else if (!ev.shiftKey && document.activeElement === last) {
        ev.preventDefault();
        first.focus();
      }
    });
    return modalGeneration;
  }
  function closeModal() {
    modalGeneration += 1;
    qs('modal-root').replaceChildren();
    if (modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus();
    modalReturnFocus = null;
  }

  // ---- Inline confirm: swap the button for a "Confirm? Yes / No" pair -------
  function armConfirm(btn) {
    var confirmReturnFocus = document.activeElement;
    var wrap = document.createElement('span');
    wrap.className = 'confirm-inline';
    var q = document.createElement('span');
    q.className = 'confirm-q';
    q.textContent = 'Confirm?';
    var yes = document.createElement('button');
    yes.type = 'button';
    yes.className = 'btn small danger';
    yes.textContent = 'Yes';
    for (var i = 0; i < btn.attributes.length; i++) {
      var at = btn.attributes[i];
      if (at.name.indexOf('data-') === 0 && at.name !== 'data-confirm') yes.setAttribute(at.name, at.value);
    }
    var no = document.createElement('button');
    no.type = 'button';
    no.className = 'btn small';
    no.textContent = 'No';
    no.setAttribute('data-act', '__cancel');
    wrap.appendChild(q); wrap.appendChild(yes); wrap.appendChild(no);
    wrap.__orig = btn;
    wrap.__restore = function () {
      wrap.replaceWith(btn);
      if (confirmReturnFocus && document.contains(confirmReturnFocus)) confirmReturnFocus.focus();
      else btn.focus();
    };
    wrap.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); wrap.__restore(); return; }
      if (ev.key !== 'Tab') return;
      if (ev.shiftKey && document.activeElement === yes) { ev.preventDefault(); no.focus(); }
      else if (!ev.shiftKey && document.activeElement === no) { ev.preventDefault(); yes.focus(); }
    });
    btn.replaceWith(wrap);
    yes.focus();
  }

  // ---- Event delegation (clicks + form submits, whole document) --------------
  function bindDelegation() {
    document.body.addEventListener('click', function (ev) {
      var btn = ev.target.closest ? ev.target.closest('[data-act]') : null;
      if (!btn || btn.disabled) return;
      var act = btn.getAttribute('data-act');
      if (act === '__cancel') {
        ev.preventDefault();
        var w = btn.closest('.confirm-inline');
        if (w && w.__restore) w.__restore();
        return;
      }
      if (btn.hasAttribute('data-confirm')) { ev.preventDefault(); armConfirm(btn); return; }
      if (act === 'logout') { ev.preventDefault(); logout(false); return; }
      if (act === 'modal-close') { ev.preventDefault(); closeModal(); return; }
      var confirmation = btn.closest('.confirm-inline');
      if (confirmation && confirmation.__restore) confirmation.__restore();
      var fn = ACT[act];
      if (fn) { ev.preventDefault(); fn(btn.dataset, btn); }
    });

      var f = ev.target;
      var name = f.getAttribute && f.getAttribute('data-form');
      if (!name) return;
      ev.preventDefault();
      var fn = FORM[name];
      if (fn) fn(formVals(f), f);

    var out = {};

    for (var i = 0; i < els.length; i++) out[els[i].name] = els[i].value;
    return out;
  }

  // ---- Generic page builders --------------------------------------------------
  function pageHead(title, sub, extraHtml) {

  // ---- Navigation / information architecture ---------------------------------

  var ROUTES = {};
  NAV.forEach(function (g) { g.items.forEach(function (it) { ROUTES[it.id] = it; }); });

  function renderSidebar(active) {
    var html = '';
    NAV.forEach(function (g) {
      html += '<div class="nav-group"><div class="label">' + esc(g.label) + '</div>';
      g.items.forEach(function (it) {
        if (it.adminOnly && !isAdmin()) return;
        var cls = 'nav-item' + (it.id === active ? ' active' : '');
        html += '<a class="' + cls + '" href="#/' + it.id + '">'
          + '<span class="ico">' + svg(it.icon) + '</span>'

      });
      html += '</div>';
    });

  // ---- Router -------------------------------------------------------------
  var statusTimer = null;
  var matchesTimer = null;
  function stopTimers() {
    if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
    if (matchesTimer) { clearInterval(matchesTimer); matchesTimer = null; }
  }
  function currentRoute() {

  // ==== Status page (public /status, no bearer needed) =======================
  var gaugeMax = {}; // rolling max per metric for a gauge feel.

  function statusClass(s) { return s === 'healthy' ? 'ok' : (s === 'degraded' ? 'warn' : 'bad'); }

  function statCard(key, icon, value, meta, gaugeKey) {
    var gauge = '';
    if (gaugeKey != null) {
      var v = typeof value === 'number' ? value : 0;
      gaugeMax[gaugeKey] = Math.max(gaugeMax[gaugeKey] || 1, v, 1);
      var pct = Math.min(100, Math.round((v / gaugeMax[gaugeKey]) * 100));
      gauge = '<div class="gauge"><i style="width:' + pct + '%"></i></div>';
    }
    return '<div class="stat"><div class="k"><span class="ico">' + svg(icon) + '</span>' + esc(key) + '</div>'
      + '<div class="v">' + esc(typeof value === 'number' ? fmtNum(value) : value) + '</div>'
      + '<div class="meta">' + esc(meta) + '</div>' + gauge + '</div>';
  }

  function capacityCard(key, icon, value, meta, percent) {
    var gauge = '';
    if (typeof percent === 'number' && isFinite(percent)) {
      gauge = '<div class="gauge"><i style="width:' + Math.max(0, Math.min(100, Math.round(percent))) + '%"></i></div>';
    }
    return '<div class="stat"><div class="k"><span class="ico">' + svg(icon) + '</span>' + esc(key) + '</div>'
      + '<div class="v">' + esc(value) + '</div>'
      + '<div class="meta">' + esc(meta) + '</div>' + gauge + '</div>';
  }

  function renderStatusShell() {
    var html = pageHead('Status', 'Live operational snapshot of this Citadel node. Auto-refreshes every 5 seconds.');
    html += '<div id="status-live"><div class="stat-grid">';
    for (var i = 0; i < 8; i++) { html += '<div class="stat"><div class="skel" style="width:40%;margin-bottom:14px"></div><div class="skel" style="height:22px;width:55%"></div></div>'; }
    html += '</div><div class="panel"><div class="panel-body"><div class="skel" style="height:14px;width:30%"></div></div></div></div>';
    setPage(html);
    refreshStatus();
    statusTimer = setInterval(refreshStatus, 5000);
  }

  function refreshStatus() {
    fetch('/status', { headers: { 'Accept': 'application/json' }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (status) {
        // Host capacity stays behind the console bearer. Keep public node
        // status useful before login or when the console session expires.
        if (!token()) { renderStatusData(status, null); return; }
        api('GET', '/console/v1/telemetry')
          .then(function (host) { renderStatusData(status, host); })
          .catch(function () { renderStatusData(status, null); });
      })
      .catch(function (e) {
        setTopStatus('bad', 'unreachable');
        var el = qs('status-live');
        if (el) el.innerHTML = '<div class="panel"><div class="empty"><div class="glyph" style="color:var(--bad);background:var(--bad-soft);border-color:rgba(229,96,95,0.35)">'
          + svg('alert') + '</div><h3>Could not reach /status</h3><p>' + esc(e.message) + '</p></div></div>';
      });
  }

  function renderStatusData(d, host) {
    var m = d.metrics || {};
    var t = d.transports || {};
    var h = host || {};
    var hostAuthorized = !!host;
    var hm = h.memory || null;
    var hs = h.storage || null;
    var sc = statusClass(d.status);

    // Top bar sync.
    setTopStatus(sc, d.status);
    setText('tb-node', d.node_id);
    setText('tb-ver', d.version);

    var html = '<div class="stat-grid">';
    html += statCard('Active connections', 'plug', m.connections_active || 0, 'currently connected', 'ca');
    html += statCard('Connections accepted', 'arrowDown', m.connections_accepted_total || 0, 'since start', 'cat');
    html += statCard('Active sessions', 'users', m.sessions_active || 0, 'authenticated', 'sa');
    html += statCard('Messages in', 'arrowDown', m.messages_in_total || 0, fmtBytes(m.bytes_in_total) + ' received', 'mi');
    html += statCard('Messages out', 'arrowUp', m.messages_out_total || 0, fmtBytes(m.bytes_out_total) + ' sent', 'mo');
    var cpuKnown = typeof h.cpu_usage_percent === 'number';
    html += capacityCard('Host CPU', 'zap', cpuKnown ? h.cpu_usage_percent + '%' : (hostAuthorized ? 'sampling' : 'sign in'), hostAuthorized ? 'all logical cores' : 'sign in to view host telemetry', cpuKnown ? h.cpu_usage_percent : null);
    var ramPct = hm && hm.total_bytes ? (hm.used_bytes / hm.total_bytes) * 100 : null;
    html += capacityCard('Host RAM', 'grid', hm ? (fmtBytes(hm.used_bytes) + ' / ' + fmtBytes(hm.total_bytes)) : (hostAuthorized ? 'unavailable' : 'sign in'), hm ? (fmtBytes(hm.available_bytes) + ' available' + (hm.process_used_bytes != null ? ' \u00b7 server ' + fmtBytes(hm.process_used_bytes) : '')) : (hostAuthorized ? 'operating system did not report memory' : 'sign in to view host telemetry'), ramPct);
    var storagePct = hs && hs.total_bytes ? (hs.used_bytes / hs.total_bytes) * 100 : null;
    html += capacityCard('Mounted storage', 'database', hs ? (fmtBytes(hs.used_bytes) + ' / ' + fmtBytes(hs.total_bytes)) : (hostAuthorized ? 'unavailable' : 'sign in'), hs ? (fmtBytes(hs.available_bytes) + ' free \u00b7 ' + fmtNum(hs.mounted_filesystems) + ' mounted filesystems') : (hostAuthorized ? 'operating system did not report storage' : 'sign in to view host capacity'), storagePct);
    html += '</div>';

    // Node info panel.
    var b = d.build || {};
    var r = d.runtime || {};
    html += '<div class="panel"><div class="panel-head"><h2>Node</h2>'
      + '<span class="pill ' + sc + '"><span class="dot"></span>' + esc(d.status) + '</span>'
      + '<div class="spacer"></div><span class="updated"><span class="dot-live"></span>updated ' + esc(new Date().toLocaleTimeString()) + '</span></div>';
    html += '<div class="panel-body"><table class="kv">'
      + kv('Node ID', d.node_id)
      + kv('Version', d.version)
      + kv('Health', d.status)
      + kv('Uptime', fmtUptime(d.uptime_seconds))
      + kv('Persistence', d.backend || '?')
      + kv('Runtime', r.enabled ? ((r.selected_language || r.configured_language || 'none') + ' / ' + (r.adapter || '?') + ' / ' + (r.tier || '?')) : 'disabled')
      + kv('Platform', (b.os || '?') + '/' + (b.arch || '?') + ' · ' + (b.profile || '?'))
      + kv('HTTP requests', fmtNum(m.http_requests_total || 0))
      + '</table></div></div>';

    // Transports panel.
    html += '<div class="panel"><div class="panel-head"><h2>Transports</h2><div class="spacer"></div>'
      + '<a href="/status" target="_blank">raw JSON</a></div>';
    html += '<div class="table-wrap"><table class="tbl"><thead><tr><th>Transport</th><th>State</th><th>Bind address</th></tr></thead><tbody>';
    html += transportRow('QUIC', t.quic);
    html += transportRow('WebSocket', t.websocket);
    html += transportRow('WebTransport', t.webtransport);
    html += '</tbody></table></div></div>';

    // The optional writer is absent rather than zeroed when disabled, so do
    // not imply that a deferred queue exists on ordinary nodes.
    var deferred = d.deferred_storage;
    if (deferred) {
      html += '<div class="panel"><div class="panel-head"><h2>Deferred storage</h2><div class="spacer"></div>'
        + '<span class="tag-soft on">enabled</span></div>';
      html += '<div class="panel-body"><table class="kv">'
        + kv('Queued items', fmtNum(deferred.queued_items || 0))
        + kv('Queued keys', fmtNum(deferred.queued_keys || 0))
        + kv('Queued bytes', fmtBytes(deferred.queued_bytes || 0))
        + kv('Oldest queued age', (deferred.queued_oldest_age_ms || 0) + ' ms')
        + kv('Accepted / coalesced', fmtNum(deferred.accepted || 0) + ' / ' + fmtNum(deferred.coalesced || 0))
        + kv('Committed / failed / cancelled', fmtNum(deferred.committed || 0) + ' / ' + fmtNum(deferred.failed || 0) + ' / ' + fmtNum(deferred.cancelled || 0))
        + kv('Rejected (full / bytes)', fmtNum(deferred.rejected_full || 0) + ' / ' + fmtNum(deferred.rejected_bytes || 0))
        + kv('Backend latency (last / total)', (deferred.backend_latency_last_ms || 0) + ' ms / ' + (deferred.backend_latency_total_ms || 0) + ' ms')
        + kv('Shutdown abandoned (receipts / bytes)', fmtNum(deferred.shutdown_abandoned || 0) + ' / ' + fmtBytes(deferred.shutdown_abandoned_bytes || 0))
        + '</table></div></div>';
    }

    var el = qs('status-live');
    if (el) el.innerHTML = html;
  }

  function transportRow(name, l) {
    l = l || {};
    var on = !!l.enabled;
    var stateTagHtml = on ? '<span class="tag-soft on">enabled</span>' : '<span class="tag-soft off">disabled</span>';
    return '<tr><td>' + esc(name) + '</td><td>' + stateTagHtml + '</td><td><span class="mono">' + esc(l.bind || '—') + '</span></td></tr>';
  }

  function setTopStatus(cls, txt) {
    var pill = qs('tb-status');
    if (!pill) return;
    pill.className = 'pill ' + (cls === 'ok' || cls === 'warn' || cls === 'bad' ? cls : 'muted');
    setText('tb-status-txt', txt);
  }

  // ==== Accounts ==============================================================
  var acc = { filter: '', offset: 0, limit: 50 };

  function renderAccounts() {
    ACT = {}; FORM = {};
    setPage(pageHead('Accounts', 'Browse and manage user accounts: profile, credentials, wallet, friends, bans.')
      + '<div class="toolbar">' + searchBox('acc-q', 'Filter by user id or username', acc.filter)
      + '<div class="grow"></div>'
      + '<button class="btn" data-act="acc-refresh">' + svg('refresh') + 'Refresh</button>'
      + '<button class="btn primary" data-act="acc-new"' + adminDis() + '>' + svg('plus') + 'Create user</button>'
      + '</div>'
      + '<div class="panel"><div class="panel-head"><h2>Accounts</h2><span class="sub" id="acc-count"></span></div>'
      + '<div id="acc-table">' + loadingRows(5) + '</div></div>');
    bindSearch('acc-q', function (v) { acc.filter = v; acc.offset = 0; loadAccounts(); });
    ACT['acc-refresh'] = loadAccounts;
    ACT['acc-new'] = accCreateModal;
    ACT['acc-open'] = function (d) { openAccount(d.id); };
    ACT['acc-prev'] = function () { acc.offset = Math.max(0, acc.offset - acc.limit); loadAccounts(); };
    ACT['acc-next'] = function () { acc.offset += acc.limit; loadAccounts(); };
    loadAccounts();
  }

  function loadAccounts() {
    var q = '/console/v1/accounts?limit=' + acc.limit + '&offset=' + acc.offset;
    if (acc.filter) q += '&filter=' + encodeURIComponent(acc.filter);
    api('GET', q).then(function (d) {
      var rows = '';
      d.items.forEach(function (a) {
        rows += '<tr class="rowlink" data-act="acc-open" data-id="' + esc(a.id) + '">'
          + '<td><b>' + esc(a.username) + '</b></td>'
          + '<td class="mono">' + esc(a.id) + '</td>'
          + '<td>' + esc(a.display_name || '—') + '</td>'
          + '<td>' + stateTag(a.state) + '</td>'
          + '<td>' + esc(fmtTime(a.created_at_unix_ms)) + '</td></tr>';
      });
      if (!d.items.length) rows = emptyRowHtml(5, acc.filter ? 'No accounts match that filter.' : 'No accounts yet. Create one, or let a client authenticate.');
      setHtml('acc-table', tableHtml(['Username', 'User ID', 'Display name', 'State', 'Created'], rows)
        + pagerHtml(acc.offset, d.items.length, d.total, 'acc'));
      setText('acc-count', fmtNum(d.total) + ' total');
    }).catch(fail);
  }

  function accCreateModal() {
    openModal('Create user',
      '<form data-form="acc-create">'
      + field('Username', textIn('username', '', 'unique handle (required)'))
      + field('Display name (optional)', textIn('display_name', '', ''))
      + '<button class="btn primary" type="submit"' + adminDis() + '>' + svg('plus') + 'Create</button>'
      + '</form>');
    FORM['acc-create'] = function (v) {
      if (!v.username) { toast('username is required', 'err'); return; }
      api('POST', '/console/v1/accounts', { username: v.username, display_name: v.display_name || undefined })
        .then(function () { closeModal(); toast('user created', 'ok'); loadAccounts(); })
        .catch(fail);
    };
  }

  function openAccount(id) {
    setPage(pageHead('Account', 'Loading…') + loadingRows(3));
    var base = '/console/v1/accounts/' + encodeURIComponent(id);
    Promise.all([api('GET', base), api('GET', base + '/wallet'), api('GET', base + '/friends')])
      .then(function (rs) { renderAccountDetail(rs[0], rs[1], rs[2]); })
      .catch(fail);
  }

  function renderAccountDetail(a, w, friends) {
    ACT = {}; FORM = {};
    var id = a.id;
    var base = '/console/v1/accounts/' + encodeURIComponent(id);

    var html = '<div class="page-head"><div class="titles"><h1>' + esc(a.username) + '</h1>'
      + '<p class="sub mono">' + esc(id) + '</p></div>' + stateTag(a.state) + '</div>';

    html += '<div class="toolbar">' + backBtn('acc-back') + '<div class="grow"></div>'
      + '<button class="btn" data-act="acc-export">' + svg('download') + 'Export</button>'
      + '<button class="btn" data-act="acc-edit"' + adminDis() + '>Edit</button>'
      + (a.state === 'disabled'
        ? '<button class="btn" data-act="acc-unban" data-confirm' + adminDis() + '>Unban</button>'
        : '<button class="btn danger" data-act="acc-ban" data-confirm' + adminDis() + '>Ban</button>')
      + '<button class="btn danger" data-act="acc-del" data-confirm' + adminDis() + '>' + svg('trash') + 'Delete</button>'
      + '</div>';

    // Profile.
    html += '<div class="panel"><div class="panel-head"><h2>Profile</h2></div><div class="panel-body"><table class="kv">'
      + kv('User ID', a.id)
      + kv('Username', a.username)
      + kv('Display name', a.display_name || '—')
      + kvRaw('State', stateTag(a.state))
      + kv('Created', fmtTime(a.created_at_unix_ms))
      + kv('Updated', fmtTime(a.updated_at_unix_ms))
      + '</table></div></div>';

    // Metadata.
    html += '<div class="panel"><div class="panel-head"><h2>Metadata</h2></div><div class="panel-body">'
      + '<pre class="code">' + esc(jsonPretty(a.metadata == null ? {} : a.metadata)) + '</pre></div></div>';

    // Linked credentials.
    var credRows = '';
    (a.identities || []).forEach(function (c) {
      credRows += '<tr><td>' + esc(c.provider) + '</td><td class="mono">' + esc(c.external_id) + '</td>'
        + '<td>' + esc(fmtTime(c.created_at_unix_ms)) + '</td></tr>';
    });
    if (!credRows) credRows = emptyRowHtml(3, 'No linked credentials.');
    html += '<div class="panel"><div class="panel-head"><h2>Linked credentials</h2></div>'
      + tableHtml(['Provider', 'External ID', 'Linked'], credRows) + '</div>';

    // Wallet.
    var balRows = '';
    var balances = (w && w.balances) || {};
    Object.keys(balances).forEach(function (c) { balRows += kv(c, fmtNum(balances[c])); });
    if (!balRows) balRows = kv('—', 'no balances yet');
    var ledgerRows = '';
    ((w && w.ledger) || []).forEach(function (l) {
      var deltaHtml = '<span style="color:' + (l.delta >= 0 ? 'var(--ok)' : 'var(--bad)') + '">'
        + (l.delta >= 0 ? '+' : '') + esc(fmtNum(l.delta)) + '</span>';
      ledgerRows += '<tr><td>' + esc(fmtTime(l.time_unix_ms)) + '</td><td>' + esc(l.currency) + '</td>'
        + '<td>' + deltaHtml + '</td><td>' + esc(fmtNum(l.balance_after)) + '</td><td>' + esc(l.reason) + '</td></tr>';
    });
    if (!ledgerRows) ledgerRows = emptyRowHtml(5, 'No ledger entries yet.');
    html += '<div class="panel"><div class="panel-head"><h2>Wallet</h2><span class="sub">balances + newest-first ledger</span></div>'
      + '<div class="panel-body"><table class="kv">' + balRows + '</table>'
      + '<form data-form="wallet-adj" class="form-row" style="margin-top:14px">'
      + '<div class="field">' + '<label>Currency</label>' + textIn('currency', '', 'coins') + '</div>'
      + '<div class="field"><label>Delta (negative debits)</label>' + textIn('delta', '', '100', 'number') + '</div>'
      + '<div class="field"><label>Reason (optional)</label>' + textIn('reason', '', 'console adjustment') + '</div>'
      + '<div class="field fixed"><button class="btn primary" type="submit"' + adminDis() + '>Apply</button></div>'
      + '</form></div>'
      + tableHtml(['Time', 'Currency', 'Δ', 'Balance', 'Reason'], ledgerRows) + '</div>';

    // Friends.
    var frRows = '';
    (friends || []).forEach(function (f) {
      frRows += '<tr><td class="mono">' + esc(f.user_id) + '</td>'
        + '<td><span class="tag-soft' + (f.state === 'friend' ? ' on' : (f.state === 'blocked' ? ' bad' : '')) + '">' + esc(f.state) + '</span></td>'
        + '<td>' + esc(fmtTime(f.updated_unix_ms)) + '</td>'
        + '<td><button class="btn small danger" data-act="fr-del" data-other="' + esc(f.user_id) + '" data-confirm' + adminDis() + '>Remove</button></td></tr>';
    });
    if (!frRows) frRows = emptyRowHtml(4, 'No relations yet.');
    html += '<div class="panel"><div class="panel-head"><h2>Friends</h2></div>'
      + '<div class="panel-body"><form data-form="fr-add" class="form-row">'
      + '<div class="field"><label>Other user id</label>' + textIn('user_id', '', 'u-2') + '</div>'
      + '<div class="field fixed"><button class="btn primary" type="submit"' + adminDis() + '>' + svg('plus') + 'Add / accept</button></div>'
      + '</form></div>'
      + tableHtml(['User ID', 'State', 'Updated', ''], frRows) + '</div>';

    setPage(html);

    ACT['acc-back'] = renderAccounts;
    ACT['acc-export'] = function () {
      api('GET', base + '/export')
        .then(function (d) { downloadJson(d, 'account-' + id + '.json'); })
        .catch(fail);
    };
    ACT['acc-edit'] = function () {
      openModal('Edit account',
        '<form data-form="acc-edit">'
        + field('Username', textIn('username', a.username, ''))
        + field('Display name (empty clears)', textIn('display_name', a.display_name || '', ''))
        + '<button class="btn primary" type="submit"' + adminDis() + '>Save</button>'
        + '</form>');
      FORM['acc-edit'] = function (v) {
        api('PUT', base, { username: v.username, display_name: v.display_name })
          .then(function () { closeModal(); toast('account updated', 'ok'); openAccount(id); })
          .catch(fail);
      };
    };
    ACT['acc-ban'] = function () {
      api('POST', base + '/ban', {}).then(function () { toast('account banned; sessions revoked', 'ok'); openAccount(id); }).catch(fail);
    };
    ACT['acc-unban'] = function () {
      api('POST', base + '/unban', {}).then(function () { toast('account re-enabled', 'ok'); openAccount(id); }).catch(fail);
    };
    ACT['acc-del'] = function () {
      api('DELETE', base).then(function () { toast('account deleted (tombstoned)', 'ok'); renderAccounts(); }).catch(fail);
    };
    ACT['fr-del'] = function (d) {
      api('DELETE', base + '/friends/' + encodeURIComponent(d.other))
        .then(function () { toast('relation removed', 'ok'); openAccount(id); }).catch(fail);
    };
    FORM['wallet-adj'] = function (v) {
      var delta = Number(v.delta);
      if (!v.currency || !delta) { toast('currency and a non-zero delta are required', 'err'); return; }
      api('POST', base + '/wallet', { currency: v.currency, delta: delta, reason: v.reason || undefined })
        .then(function () { toast('wallet adjusted', 'ok'); openAccount(id); })
        .catch(fail);
    };
    FORM['fr-add'] = function (v) {
      if (!v.user_id) { toast('user id is required', 'err'); return; }
      api('POST', base + '/friends', { user_id: v.user_id })
        .then(function () { toast('relation updated', 'ok'); openAccount(id); })
        .catch(fail);
    };
  }

  // ==== Database Explorer ======================================================
  // This section intentionally has no SQL input. The server validates all
  // table/column identifiers against live metadata and accepts only structured
  // filters. Row references and page cursors are opaque server-held handles.
  var dbx = { table: null, description: null, rows: [], next: null, filterColumn: '', filterValue: '' };

  function renderDatabase() {
    ACT = {}; FORM = {};
    setPage(pageHead('Database Explorer', 'Read-only, metadata-validated diagnostics. Sensitive values are redacted by the server.')
      + '<div class="toolbar"><div class="grow"></div><button class="btn" data-act="db-refresh">' + svg('refresh') + 'Refresh</button></div>'
      + '<div class="panel"><div class="panel-head"><h2>Application tables and views</h2><span class="sub" id="db-count"></span></div><div id="db-table">' + loadingRows(3) + '</div></div>');
    ACT['db-refresh'] = loadDatabaseTables;
    ACT['db-open'] = function (d) { openDatabaseTable(d.schema, d.table); };
    loadDatabaseTables();
  }

  function loadDatabaseTables() {
    api('GET', '/console/v1/database').then(function (d) {
      var rows = '';
      d.tables.forEach(function (t) {
        rows += '<tr class="rowlink" data-act="db-open" data-schema="' + esc(t.table.schema) + '" data-table="' + esc(t.table.table) + '">'
          + '<td><b>' + esc(t.table.table) + '</b></td><td class="mono">' + esc(t.table.schema) + '</td><td>' + esc(t.kind) + '</td></tr>';
      });
      if (!rows) rows = emptyRowHtml(3, 'No application tables are available on this backend.');
      setHtml('db-table', tableHtml(['Table', 'Schema', 'Kind'], rows));
      setText('db-count', fmtNum(d.tables.length) + ' resource(s)');
    }).catch(fail);
  }

  function openDatabaseTable(schema, table) {
    api('GET', '/console/v1/database/' + encodeURIComponent(schema) + '/' + encodeURIComponent(table)).then(function (d) {
      dbx.table = d.table; dbx.description = d; dbx.rows = []; dbx.next = null; dbx.filterColumn = ''; dbx.filterValue = '';
      renderDatabaseTable(); loadDatabaseRows(true);
    }).catch(fail);
  }

  function dbVisibleColumns() { return (dbx.description.columns || []).filter(function (c) { return !c.sensitive; }); }
  function dbSortColumn() {
    var columns = dbVisibleColumns();
    var primary = (dbx.description.primary_key || []).filter(function (key) { return columns.some(function (c) { return c.name === key; }); });
    return primary[0] || (columns[0] && columns[0].name) || '';
  }
  function dbValue(value) {
    if (!value) return '<span class="mono">null</span>';
    if (value.kind === 'redacted') return '<span class="tag-soft bad">redacted</span>';
    if (value.kind === 'null') return '<span class="mono">null</span>';
    return '<span class="mono">' + esc(typeof value.value === 'string' ? value.value : jsonPretty(value.value)) + '</span>';
  }

  function renderDatabaseTable() {
    ACT = {}; FORM = {};
    var d = dbx.description, visible = dbVisibleColumns(), sort = dbSortColumn();
    var html = pageHead('Database · ' + d.table.table, 'Read-only rows. Filters are scalar JSON values; sensitive columns cannot be filtered or sorted.')
      + '<div class="toolbar">' + backBtn('db-back') + '<div class="grow"></div><button class="btn" data-act="db-reload">' + svg('refresh') + 'Refresh</button></div>';
    html += '<div class="panel"><div class="panel-head"><h2>Schema</h2><span class="sub">keyset paging: ' + (d.capabilities.stable_keyset_pagination ? 'available' : 'unavailable') + '</span></div>'
      + tableHtml(['Column', 'Type', 'Nullable', 'Visibility'], visible.map(function (c) { return '<tr><td><b>' + esc(c.name) + '</b></td><td class="mono">' + esc(c.data_type || '—') + '</td><td>' + esc(String(c.nullable)) + '</td><td>visible</td></tr>'; }).join('') || emptyRowHtml(4, 'No visible columns.')) + '</div>';
    var options = '<option value="">No filter</option>';
    visible.forEach(function (c) { options += '<option value="' + esc(c.name) + '"' + (dbx.filterColumn === c.name ? ' selected' : '') + '>' + esc(c.name) + '</option>'; });
    html += '<div class="panel"><div class="panel-head"><h2>Rows</h2><span class="sub">max 100 per page; values are never written</span></div><div class="panel-body"><form data-form="db-filter"><div class="form-row">'
      + field('Filter column', '<select class="form-in" name="column">' + options + '</select>')
      + field('Equals (JSON scalar)', textIn('value', dbx.filterValue, 'e.g. "player" or 42'))
      + '<div class="field fixed"><button class="btn primary" type="submit">Apply</button></div></div></form></div><div id="db-rows">' + loadingRows(Math.max(2, visible.length + 1)) + '</div></div>';
    setPage(html);
    ACT['db-back'] = renderDatabase;
    ACT['db-reload'] = function () { loadDatabaseRows(true); };
    ACT['db-more'] = function () { loadDatabaseRows(false); };
    ACT['db-detail'] = function (data) { openDatabaseRow(data.rowRef); };
    FORM['db-filter'] = function (v) { dbx.filterColumn = v.column || ''; dbx.filterValue = v.value || ''; loadDatabaseRows(true); };
  }

  function loadDatabaseRows(reset) {
    var sort = dbSortColumn();
    if (!sort) { setHtml('db-rows', emptyRowHtml(1, 'This table has no safe sortable primary key.')); return; }
    if (reset) { dbx.rows = []; dbx.next = null; }
    var filters = [];
    if (dbx.filterColumn) {
      var value;
      try { value = JSON.parse(dbx.filterValue); } catch (e) { toast('Filter value must be a JSON scalar, for example "player" or 42.', 'err'); return; }
      if (value && typeof value === 'object') { toast('Filter value must be a JSON scalar.', 'err'); return; }
      filters.push({ column: dbx.filterColumn, operator: 'eq', value: value });
    }
    api('POST', '/console/v1/database/rows', { table: dbx.table, filters: filters, sort: { column: sort, direction: 'asc' }, cursor: reset ? undefined : dbx.next, limit: 50 }).then(function (d) {
      dbx.rows = dbx.rows.concat(d.rows || []); dbx.next = d.next || null; renderDatabaseRows();
    }).catch(fail);
  }

  function renderDatabaseRows() {
    var visible = dbVisibleColumns(), rows = '';
    dbx.rows.forEach(function (row) {
      rows += '<tr class="rowlink" data-act="db-detail" data-row-ref="' + esc(row.row_ref) + '">';
      visible.forEach(function (column) { rows += '<td>' + dbValue(row.values[column.name]) + '</td>'; });
      rows += '<td>Inspect</td></tr>';
    });
    if (!rows) rows = emptyRowHtml(visible.length + 1, 'No rows match the current filter.');
    setHtml('db-rows', tableHtml(visible.map(function (c) { return c.name; }).concat(['']), rows)
      + (dbx.next ? '<div class="pager"><div class="grow"></div><button class="btn small" data-act="db-more">Load more</button></div>' : ''));
  }

  function openDatabaseRow(rowRef) {
    api('POST', '/console/v1/database/row', { table: dbx.table, row_ref: rowRef }).then(function (row) {
      var html = '<table class="kv">';
      Object.keys(row.values).forEach(function (key) { html += kvRaw(key, dbValue(row.values[key])); });
      openModal('Read-only row detail', html + '</table>');
    }).catch(fail);
  }

  // ==== Storage ================================================================
  var sto = { col: null, user: '', items: [], next: null, obj: null };

  function renderStorage() {
    ACT = {}; FORM = {};
    setPage(pageHead('Storage', 'Browse the collection/key/user storage engine with operator authority.')
      + '<div class="toolbar"><div class="grow"></div>'

  function loadCollections() {
    api('GET', '/console/v1/storage').then(function (d) {
      var rows = '';
      d.collections.forEach(function (c) {
        rows += '<tr class="rowlink" data-act="sto-open-col" data-col="' + esc(c.collection) + '">'

      });
      if (!d.collections.length) rows = emptyRowHtml(2, 'No collections yet: nothing has been stored on this node.');

  function openCollection(reset) {
    if (reset) { sto.items = []; sto.next = null; }
    var q = '/console/v1/storage/' + encodeURIComponent(sto.col) + '?limit=50';
    if (sto.user) q += '&user_id=' + encodeURIComponent(sto.user);
    if (!reset && sto.next) q += '&cursor=' + encodeURIComponent(sto.next);
    api('GET', q).then(function (d) {
      sto.items = sto.items.concat(d.items);
      sto.next = d.next || null;
      renderCollectionView();
    }).catch(fail);
  }

  function renderCollectionView() {
    ACT = {}; FORM = {};
    var html = pageHead('Storage · ' + sto.col, 'Object summaries (no values). Click a row to inspect and edit.');
    html += '<div class="toolbar">' + backBtn('sto-back')
      + searchBox('sto-user', 'Filter by owner user id (empty = system owner)', sto.user)
      + '<div class="grow"></div>'
      + '<button class="btn" data-act="sto-reload">' + svg('refresh') + 'Refresh</button></div>';

    var rows = '';
    sto.items.forEach(function (o) {
      rows += '<tr class="rowlink" data-act="sto-open-obj" data-key="' + esc(o.key) + '" data-owner="' + esc(o.user_id || '') + '">'
        + '<td><b>' + esc(o.key) + '</b></td>'
        + '<td class="mono">' + (o.user_id ? esc(o.user_id) : '<span class="tag-soft off">system</span>') + '</td>'
        + '<td class="mono">' + esc(o.version) + '</td>'
        + '<td class="mono">' + esc(o.read_permission) + ' / ' + esc(o.write_permission) + '</td></tr>';
    });
    if (!rows) rows = emptyRowHtml(4, 'No objects match.');
    html += '<div class="panel"><div class="panel-head"><h2>Objects</h2><span class="sub">' + esc(fmtNum(sto.items.length)) + ' loaded</span></div>'
      + tableHtml(['Key', 'Owner', 'Version', 'Read / Write'], rows)
      + (sto.next ? '<div class="pager"><div class="grow"></div><button class="btn small" data-act="sto-more">Load more</button></div>' : '')
      + '</div>';

    setPage(html);
    bindSearch('sto-user', function (v) { sto.user = v; openCollection(true); });
    ACT['sto-back'] = renderStorage;
    ACT['sto-reload'] = function () { openCollection(true); };
    ACT['sto-more'] = function () { openCollection(false); };
    ACT['sto-open-obj'] = function (d) { openObject(d.key, d.owner || null); };

  function objectPath(key, owner) {
    var p = '/console/v1/storage/' + encodeURIComponent(sto.col) + '/' + encodeURIComponent(key);
    if (owner) p += '?user_id=' + encodeURIComponent(owner);
    return p;
  }

  function openObject(key, owner) {
    api('GET', objectPath(key, owner)).then(function (o) {
      sto.obj = o;
      renderObjectView();
    }).catch(fail);
  }

  function renderObjectView() {
    ACT = {}; FORM = {};
    var o = sto.obj;
    var permSel = function (name, current, options) {
      var h = '<select class="form-in" name="' + name + '">';
      options.forEach(function (opt) {
        h += '<option value="' + opt[0] + '"' + (opt[0] === current ? ' selected' : '') + '>' + opt[0] + ' — ' + esc(opt[1]) + '</option>';
      });
      return h + '</select>';
    };
    var html = pageHead('Storage · ' + sto.col + ' / ' + o.key, 'Full object: value, version, permissions. Saves are version-conditional.');
    html += '<div class="toolbar">' + backBtn('sto-obj-back') + '<div class="grow"></div>'
      + '<button class="btn danger" data-act="sto-del" data-confirm' + adminDis() + '>' + svg('trash') + 'Delete object</button></div>';

    html += '<div class="panel"><div class="panel-head"><h2>Object</h2></div><div class="panel-body"><table class="kv">'
      + kv('Collection', o.collection)
      + kv('Key', o.key)
      + kv('Owner', o.user_id || 'system')
      + kv('Version', o.version)
      + '</table></div></div>';

    html += '<div class="panel"><div class="panel-head"><h2>Edit</h2><span class="sub">JSON object value</span></div>'
      + '<div class="panel-body"><form data-form="sto-save">'
      + field('Value (JSON object)', '<textarea class="code-in" name="value" style="min-height:200px">' + esc(jsonPretty(o.value)) + '</textarea>')
      + '<div class="form-row">'
      + '<div class="field">' + '<label>Read permission</label>'
      + permSel('read_permission', o.read_permission, [[0, 'no read'], [1, 'owner read'], [2, 'public read']]) + '</div>'
      + '<div class="field"><label>Write permission</label>'
      + permSel('write_permission', o.write_permission, [[0, 'no write'], [1, 'owner write']]) + '</div>'
      + '<div class="field fixed"><button class="btn primary" type="submit"' + adminDis() + '>Save</button></div>'
      + '</div></form></div></div>';

    setPage(html);

    ACT['sto-obj-back'] = function () { openCollection(true); };
    ACT['sto-del'] = function () {
      api('DELETE', objectPath(o.key, o.user_id))
        .then(function () { toast('object deleted', 'ok'); openCollection(true); })
        .catch(fail);
    };
    FORM['sto-save'] = function (v) {
      var value;
      try { value = JSON.parse(v.value); } catch (e) { toast('value must be valid JSON', 'err'); return; }
      api('PUT', objectPath(o.key, o.user_id), {
        value: value,
        read_permission: Number(v.read_permission),
        write_permission: Number(v.write_permission),
        version: o.version
      }).then(function (saved) {
        sto.obj = saved;
        toast('object saved (version ' + saved.version + ')', 'ok');
        renderObjectView();
      }).catch(function (e) {
        if (e && e.status === 409) toast('version conflict — the object changed; reload it and retry', 'err');
        else fail(e);
      });
    };
  }

      var error = qs('api-key-form-error');
      function formError(message) {
        if (!error) return;
        error.textContent = message || '';
        if (message) error.removeAttribute('hidden'); else error.setAttribute('hidden', '');
      }
      var name = (values.name || '').trim();
      if (!name) { formError('Name is required.'); return; }
      if (!selected.length) { formError('Choose at least one read scope.'); return; }
      var expiresAt = null;
      if (values.expires_at) {
        expiresAt = Date.parse(values.expires_at);
        if (!Number.isFinite(expiresAt) || expiresAt <= Date.now()) {
          formError('Expiration must be a valid future date and time.');
          return;
        }
      }
      formError('');
      var requestContext = captureApiKeyRequestContext();
      api('POST', '/console/v1/api-keys', { name: name, scopes: selected, expires_at: expiresAt })
        .then(function (issued) {
          if (!apiKeyRequestContextIsCurrent(requestContext)) return;
          loadApiKeys();
          showApiKeySecret('API key created', issued);

        .catch(function (apiError) { formError(apiError.message || 'request failed'); });

      var secretNode = qs('api-key-secret');

      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        error.textContent = 'Clipboard access is unavailable. Select and copy the secret manually.';
